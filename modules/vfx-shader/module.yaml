schema_version: 1
id: vfx-shader
version: 0.1.0
title: VFX and Shader Studio
description: Defines reviewable VFX recipes, deterministic previews, budgets, event bindings, and approved Unity publication.
status: active
feature_flag: vfx_shader

requires:
  modules:
    - core-kernel
    - module-runtime
    - world-composer
    - asset-library
  integrations: []
  optional_integrations:
    - unity
    - render

contributes:
  editors:
    - vfx.recipe
    - shader.parameters
    - vfx.preview
    - lookdev.material
  commands:
    - lookdev.open
    - vfx.recipe.validate
    - vfx.preview.plan
    - vfx.recipe.publish
    - vfx.binding.set_enabled
  events:
    - vfx.recipe.validated@1
    - vfx.preview.planned@1
    - vfx.recipe.published@1
    - vfx.binding.changed@1
  jobs:
    - vfx.preview.plan
    - vfx.recipe.publish
  workflows:
    - approved-highlight-to-unity
  policy_gates:
    - vfx.budget
    - vfx.approval

permissions:
  - vfx:read
  - vfx:write
  - vfx:publish

entrypoints:
  frontend: ./frontend/src/index.ts
  backend: vfx_shader
