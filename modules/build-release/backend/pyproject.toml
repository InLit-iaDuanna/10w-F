[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-build-release"
version = "0.1.0"
description = "SceneOps Forge build and release module"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.7",
]

[project.optional-dependencies]
test = ["PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
