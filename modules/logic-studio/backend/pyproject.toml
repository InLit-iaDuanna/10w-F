[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-logic-studio"
version = "0.1.0"
description = "Deterministic gameplay graph and reviewed code-change services for SceneOps Forge."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1.0",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "sceneops-core-contracts==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
