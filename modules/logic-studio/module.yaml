schema_version: 1
id: logic-studio
version: 0.1.0
title: Logic Studio
description: Builds, validates, reviews, and tests inspectable gameplay logic graphs.
status: active
feature_flag: logic_studio

requires:
  modules:
    - core-kernel
    - module-runtime
  integrations: []
  optional_integrations:
    - unity

contributes:
  editors:
    - logic.feature
    - logic.state_graph
    - logic.interaction_graph
    - logic.quest_dialogue
    - logic.code_diff
    - logic.test_cases
  commands:
    - logic.editor.open
    - logic.graph.validate
    - logic.interaction.compile
    - logic.test_plan.generate
    - logic.code_change.propose
    - logic.code_change.approve
    - logic.code_change.apply
    - logic.code_change.rollback
  events:
    - logic.graph.validated@1
    - logic.test_plan.generated@1
    - logic.code_change.proposed@1
    - logic.code_change.rolled_back@1
  jobs:
    - logic.graph.validate
    - logic.test_plan.generate
    - logic.unity.code.validate
  workflows:
    - logic-feature-to-validated-unity
  policy_gates:
    - logic.graph.valid
    - logic.code_change.approved
    - logic.compile_tests.passed

permissions:
  - logic:read
  - logic:write
  - logic:test
  - logic:code:review
  - logic:code:approve

entrypoints:
  frontend: ./frontend/src/index.ts
  backend: logic_studio
