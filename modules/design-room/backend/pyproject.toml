[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sceneops-design-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.8", "pydantic==2.13.2", "sceneops-codebuddy-cli==0.1.0", "sceneops-ai-provider==0.1.0", "sceneops-ai-context-engine==0.5.0", "sceneops-ai-run-distiller==0.5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sceneops_design_ai"]
