[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[project]
name = "sceneops-conversation-home"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.8", "pydantic==2.13.2", "sceneops-ai-provider==0.1.0", "sceneops-ai-run-distiller==0.5.0"]
[tool.hatch.build.targets.wheel]
packages = ["src/conversation_home"]
