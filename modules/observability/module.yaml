schema_version: 1
id: observability
version: 0.1.0
title: Observability
description: Correlates progress, structured logs, traces, and safe diagnostic exports.
status: active
feature_flag: observability

requires:
  modules:
    - core-kernel
    - module-runtime
  integrations: []
  optional_integrations:
    - artifact-store

contributes:
  editors:
    - observability.logs
  commands:
    - observability.logs.search
    - observability.diagnostic.export
  events:
    - job.progress.reported@1
    - observability.log.recorded@1
  jobs: []
  workflows: []
  policy_gates:
    - observability.diagnostic-redaction

permissions:
  - observability:read
  - observability:write
  - observability:export

entrypoints:
  frontend: ./frontend/src/index.ts
  backend: observability
