[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-observability"
version = "0.1.0"
description = "SceneOps Forge structured event and diagnostic gateway"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.135.2", "starlette==1.3.1",
  "pydantic==2.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]
