[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[project]
name = "sceneops-ai-context-engine"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sceneops-harness==0.5.0",
  "sceneops-project-workspace==0.1.0",
]
[tool.hatch.build.targets.wheel]
packages = ["src/sceneops_ai_context"]
