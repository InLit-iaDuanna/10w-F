[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-engine-unity"
version = "0.1.0"
description = "Typed and safe Unity adapter for SceneOps Forge"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]
