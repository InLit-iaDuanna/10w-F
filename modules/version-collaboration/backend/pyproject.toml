[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-version-collaboration"
version = "0.1.0"
description = "SceneOps Forge version and collaboration module"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
