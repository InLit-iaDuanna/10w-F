[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-concept-lab"
version = "0.1.0"
description = "SceneOps Forge Concept Lab backend module"
requires-python = ">=3.11"
dependencies = [
  "sceneops-codebuddy-cli==0.1.0",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "jsonschema>=4.20,<5",
  "pytest>=8,<9",
  "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["src/concept_lab/tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
concept_lab = ["fixtures/*.json"]
