schema_version: 1
id: runtime-fixture
version: 0.1.0
title: Runtime Fixture
description: Proves deterministic registration, enablement, and explicit success and failure states.
status: experimental
feature_flag: runtime_fixture
requires:
  modules:
    - core-kernel
    - module-runtime
  integrations: []
  optional_integrations:
    - fixture-renderer
contributes:
  editors:
    - runtime.fixture
  commands:
    - runtime.fixture.run
  events:
    - runtime.fixture.completed@1
  jobs:
    - runtime.fixture.execute
  workflows: []
  policy_gates: []
permissions:
  - runtime-fixture:read
  - runtime-fixture:execute
entrypoints:
  frontend: ./frontend/src/index.ts
  backend: runtime_fixture
