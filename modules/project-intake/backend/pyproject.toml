[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-project-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.128,<1", "pydantic>=2.12,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sceneops_project_workspace = ["runtime_v1_sources.json", "runtime_v1_targets.json"]
