schema_version: 1
id: render-ops
version: 0.1.0
title: Render Ops
description: >-
  Captures deterministic AOVs, creates traceable AI-assisted render variants,
  proposes approved editable writebacks, and validates fixed-camera changes.
status: active
feature_flag: render_ops

requires:
  modules:
    - core-kernel
    - module-runtime
  integrations:
    - artifact-store
  optional_integrations:
    - comfyui
    - blender
    - unity

contributes:
  editors:
    - render.viewer
    - render.aov-viewer
    - render.recipe
    - render.queue
    - render.comparison
    - render.provenance
  commands:
    - render.brief.create
    - render.aov.capture
    - render.recipe.run
    - render.job.cancel
    - render.job.retry
    - render.variant.approve
    - render.writeback.propose
    - render.writeback.apply
    - render.validation.run
  events:
    - render.job.started@1
    - render.job.progressed@1
    - render.job.failed@1
    - render.job.cancelled@1
    - render.variant.created@1
    - render.writeback.proposed@1
    - render.validation.completed@1
  jobs:
    - render.aov.capture
    - render.variant.generate
    - render.writeback.apply
    - render.validation.capture
  workflows:
    - render.asset-turntable
    - render.material-variant
    - render.lighting-visibility
    - render.fixed-camera-regression
    - render.marketing-still
  policy_gates:
    - render.writeback.approval
    - render.protected-regions

permissions:
  - render:read
  - render:run
  - render:approve
  - render:writeback

entrypoints:
  frontend: ./frontend/src/index.ts
  backend: render_ops
