[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-character-animation"
version = "0.1.0"
description = "SceneOps Forge character and animation module"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.128.8",
  "pydantic==2.13.2",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
