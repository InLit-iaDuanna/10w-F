[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-ai-playtest"
version = "0.1.0"
description = "Bounded AI playtest, evidence, backpin, and regression module for SceneOps Forge"
requires-python = ">=3.10"
dependencies = [
  "pydantic==2.13.2",
  "fastapi==0.135.2", "starlette==1.3.1",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "PyYAML==6.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
