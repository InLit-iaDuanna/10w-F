[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-production-planner"
version = "0.1.0"
description = "SceneOps Forge production planning domain module"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
