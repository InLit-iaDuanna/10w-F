[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[project]
name = "sceneops-ai-agent-runtime"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = ["sceneops-harness==0.5.0", "sceneops-ai-provider==0.1.0", "sceneops-ai-model-router==0.5.0",
    "sceneops-ai-context-engine==0.5.0", "fastapi>=0.115,<1", "sceneops-engine-unity==0.1.0", "sceneops-blender-adapter==0.1.0"]
[tool.hatch.build.targets.wheel]
packages = ["src/sceneops_ai_agents"]
