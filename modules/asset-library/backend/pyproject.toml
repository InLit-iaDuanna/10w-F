[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-asset-library"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.100,<1",
  "pydantic>=2.8,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asset_library = ["builtin_assets/*.json", "builtin_assets/glb/*.glb", "builtin_assets/previews/*.png", "builtin_assets/*.md", "builtin_assets/*.txt"]
