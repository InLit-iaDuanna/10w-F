schema_version: 1
id: audio-studio
version: 0.1.0
title: Audio Studio
description: 管理可审查的游戏音频任务、分析、事件绑定与 Unity 映射。
status: active
feature_flag: audio_studio

requires:
  modules:
    - core-kernel
    - module-runtime
  integrations: []
  optional_integrations:
    - unity
    - artifact-store
    - media-generation

contributes:
  editors:
    - audio.studio
  commands:
    - audio.spec.create
    - audio.asset.inspect
    - audio.event.bind
    - audio.mapping.propose
    - audio.mapping.publish
  events:
    - audio.spec.created@1
    - audio.asset.inspected@1
    - audio.event.bound@1
    - audio.mapping.published@1
  jobs:
    - audio.analysis
  workflows:
    - hero-key-door-audio

  policy_gates: []

permissions:
  - audio:read
  - audio:write
  - audio:publish

entrypoints:
  frontend: ./frontend/src/index.ts
  backend: audio_studio
