[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-integration-center"
version = "0.1.0"
description = "SceneOps Forge integration health and recovery control plane"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.135.2", "starlette==1.3.1",
  "pydantic==2.13.2",
  "sceneops-observability==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
