[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneops-integration-center"
version = "0.1.0"
description = "SceneOps Forge integration health and recovery control plane"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.128.8",
  "pydantic==2.13.2",
  "sceneops-observability==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
